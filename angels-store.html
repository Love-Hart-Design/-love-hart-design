<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angels Store Updater</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#333;line-height:1.5}
h1{font-size:1.5rem}
button,input{font:inherit}
input[type=file]{display:block;margin:18px 0;padding:12px;border:2px dashed #999;width:100%}
button{background:#3f78ad;color:#fff;border:0;padding:14px 22px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:18px;padding:12px;border-radius:4px;display:none}
#msg.ok{display:block;background:#e3f5e8;color:#1b6e3a}
#msg.err{display:block;background:#fde7e7;color:#b00020}
</style>
</head>
<body>
<h1>Angels Store Updater</h1>
<p>Adds <b>The Celestial Guardians Collection</b> and the 10 angel themes. Nothing else on the page changes.</p>
<p><b>Step 1:</b> choose your current <b>angels-store.html</b>.</p>
<input type="file" id="f" accept=".html,text/html">
<p><b>Step 2:</b> click the button. The finished <b>angels-store.html</b> downloads.</p>
<button id="go" disabled>Make updated angels-store.html</button>
<div id="msg"></div>
<script>
var EDITS = [
  [`const CATEGORIES = ['Guardian Angels','Angel Wings','Halos','Cherubs','Memorial','Faith','Hope','Peace','Heaven','Remembrance'];`,
   `const CATEGORIES = ['Guardian Angels','Angel Wings','Halos','Cherubs','Memorial','Faith','Hope','Peace','Heaven','Remembrance','Guardian Angel of the Enchanted Forest','Warrior Angel of the Crimson Skies','Angel of the Frozen Cathedral','Angel of the Ancient Rose Garden','Angel of the Golden Harvest','Fallen Angel of the Forgotten Ruins','Angel of the Sapphire Night','Angel Mother and Sleeping Child','Angel of the Waterfall Sanctuary','Angel Queen of the Heavenly Court'];`],
  [`const COLLECTIONS = ['Angel Favorites','Halloween','Thanksgiving','Christmas'];`,
   `const COLLECTIONS = ['Angel Favorites','The Celestial Guardians Collection','Halloween','Thanksgiving','Christmas'];`],
  [`sec('collections', 'Collections', [['Angel Favorites', href('all', {col:'Angel Favorites'})], ['Holidays', href('holidays')]])`,
   `sec('collections', 'Collections', [['Angel Favorites', href('all', {col:'Angel Favorites'})], ['The Celestial Guardians Collection', href('all', {col:'The Celestial Guardians Collection'})], ['Holidays', href('holidays')]])`],
  [`collections: el('div', {className:'dm'}, [lnk('Angel Favorites', href('all', {col:'Angel Favorites'})), sub('Holidays', holidays)]),`,
   `collections: el('div', {className:'dm'}, [lnk('Angel Favorites', href('all', {col:'Angel Favorites'})), lnk('The Celestial Guardians Collection', href('all', {col:'The Celestial Guardians Collection'})), sub('Holidays', holidays)]),`]
];
var file = null, msg = document.getElementById('msg'), go = document.getElementById('go');
function say(t, cls){ msg.textContent = t; msg.className = cls; }
document.getElementById('f').onchange = function(e){
  file = e.target.files[0] || null;
  go.disabled = !file;
  msg.className = '';
};
go.onclick = function(){
  var r = new FileReader();
  r.onload = function(){
    var t = r.result;
    if(t.indexOf('The Celestial Guardians Collection') !== -1){ say('This file already has the collection. Nothing was changed.', 'err'); return; }
    for(var i = 0; i < EDITS.length; i++){
      var n = t.split(EDITS[i][0]).length - 1;
      if(n !== 1){ say('Stopped: change ' + (i + 1) + ' of 4 could not be found in this file, so nothing was downloaded. Make sure you chose the Angels store file (angels-store.html).', 'err'); return; }
      t = t.replace(EDITS[i][0], function(){ return EDITS[i][1]; });
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type:'text/html'}));
    a.download = 'angels-store.html';
    document.body.appendChild(a); a.click(); a.remove();
    say('Done. All 4 changes applied. Upload the downloaded angels-store.html in place of the old one.', 'ok');
  };
  r.readAsText(file);
};
</script>
</body>
</html>
