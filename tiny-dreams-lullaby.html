<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Dreams Lullaby | Love Hart Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#232a5c;--dusk:#8e9be0;--moon:#ffe7a3;--mist:#f3f1fb;--blush:#f7c9d6;--ink:#1b1f45;--line:#d9d5ee;
--display:'Fredoka','Trebuchet MS',sans-serif;--body:'DM Sans','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);background:var(--mist);color:var(--ink);line-height:1.5}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--night);outline-offset:2px}
.sky{background:var(--night);color:#fff;position:relative;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;position:relative;z-index:2}
.bar a{color:#fff;text-decoration:none;font-weight:500}
.cartbtn{background:var(--moon);color:var(--night);border:0;border-radius:99px;padding:8px 16px;font-weight:700}
.hero{padding:30px 5vw 70px;max-width:1100px;margin:auto;position:relative;z-index:2}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.05;max-width:11ch}
.hero p{margin:14px 0 26px;font-size:1.15rem;max-width:34ch;color:#dfe2fa}
.cta{background:var(--moon);color:var(--night);border:0;border-radius:99px;padding:14px 30px;font-weight:700;font-size:1.05rem;text-decoration:none;display:inline-block}
.moon{position:absolute;right:7vw;top:40px;width:clamp(120px,22vw,240px);aspect-ratio:1;border-radius:50%;background:var(--night);box-shadow:inset -34px 10px 0 0 var(--moon);transform:rotate(-12deg)}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--moon)}
.wrap{max-width:1100px;margin:auto;padding:0 5vw}
h2{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:42px 0 14px}
.dreamers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dreamer{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px 12px;text-align:center;font-family:var(--display);font-size:1.1rem;color:var(--ink)}
.dreamer small{display:block;font-family:var(--body);font-size:.8rem;color:#5b5f88}
.dreamer[aria-pressed=true]{background:var(--night);border-color:var(--night);color:#fff}
.dreamer[aria-pressed=true] small{color:var(--moon)}
.chips{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;background:var(--night);padding:18px 5vw calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(27,31,69,.25)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;background:transparent;border:2px solid var(--dusk);border-radius:99px;padding:8px 18px;color:#fff;font-weight:500;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.chip[aria-pressed=true]{background:var(--moon);border-color:var(--moon);color:var(--night);font-weight:700}
@media(hover:hover){.chip:hover,.chip:focus-visible{transform:translateY(-5px) scale(1.1);box-shadow:0 8px 14px rgba(0,0,0,.35);background:var(--dusk);border-color:var(--dusk)}
.chip[aria-pressed=true]:hover{background:var(--moon);border-color:var(--moon)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;margin:22px 0 110px}
.card{background:#fff;border-radius:18px;border:0;padding:0;text-align:left;overflow:hidden;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--mist);display:block}
.card div{padding:12px 14px 16px}
.card b{display:block;font-weight:500}
.card span{color:var(--night);font-weight:700}
.note{padding:40px 0;text-align:center;color:#5b5f88;grid-column:1/-1}
dialog{border:0;border-radius:24px;padding:0;max-width:760px;width:92vw;color:var(--ink)}
dialog::backdrop{background:rgba(27,31,69,.6)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pd img{width:100%;height:100%;object-fit:cover;min-height:260px;background:var(--mist)}
.pd .info{padding:26px;display:flex;flex-direction:column;gap:12px}
.pd h3{font-family:var(--display);font-size:1.5rem;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;min-width:44px}
.opt[aria-pressed=true]{border-color:var(--night);background:var(--night);color:#fff}
.x{position:absolute;right:12px;top:10px;background:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:1.2rem}
.add{background:var(--night);color:#fff;border:0;border-radius:99px;padding:13px;font-weight:700}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:#fff;transform:translateX(100%);transition:transform .25s;z-index:20;display:flex;flex-direction:column;padding:20px}
.drawer.open{transform:none}
.items{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.line button{background:none;border:0;color:#5b5f88;text-decoration:underline}
.msg{font-size:.9rem;color:#5b5f88;margin-top:8px;min-height:1.3em}
footer{background:var(--night);color:#dfe2fa;padding:30px 5vw;text-align:center}
footer a{color:var(--moon)}
@media(max-width:620px){.pd{grid-template-columns:1fr}.moon{opacity:.35}}
@media(prefers-reduced-motion:reduce){.drawer,.chip{transition:none}.chip:hover,.chip:focus-visible{transform:none}}
</style>
</head>
<body>

<header class="sky">
  <div class="moon" aria-hidden="true"></div>
  <span class="star" style="left:12%;top:30%" aria-hidden="true"></span>
  <span class="star" style="left:46%;top:18%;width:4px;height:4px" aria-hidden="true"></span>
  <span class="star" style="left:70%;top:62%" aria-hidden="true"></span>
  <div class="bar">
    <a href="index.html">&larr; Love Hart Design</a>
    <button class="cartbtn" id="openCart">Cart (<span id="cartCount">0</span>)</button>
  </div>
  <div class="hero">
    <h1>Tiny Dreams Lullaby</h1>
    <p>Dream big. Dream sweet. Dream tiny. Sleepy-time shirts and hoodies for the whole family.</p>
    <a class="cta" href="#shop">Shop now</a>
  </div>
</header>

<main class="wrap" id="shop">
  <h2>Who are you shopping for?</h2>
  <div class="dreamers" id="dreamers"></div>
  <div class="chips" id="chips" aria-label="Product type"></div>
  <div class="grid" id="grid" aria-live="polite"><p class="note">Loading products&hellip;</p></div>
</main>

<footer>
  <p>Tiny Dreams Lullaby is part of <a href="index.html">Love Hart Design</a> &middot; <a href="https://youtube.com/@TinyDreamsLullaby">YouTube</a></p>
</footer>

<dialog id="dlg"><button class="x" id="closeDlg" aria-label="Close">&times;</button><div class="pd" id="pd"></div></dialog>

<aside class="drawer" id="drawer" aria-label="Cart">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0">Your cart</h2><button class="x" style="position:static" id="closeCart" aria-label="Close cart">&times;</button>
  </div>
  <div class="items" id="items"></div>
  <p><b>Total: <span id="total">$0.00</span></b></p>
  <button class="add" id="checkout">Check out</button>
  <p class="msg" id="msg"></p>
</aside>

<script>
/* ---- CONFIG: copy FUNCTION_URL and ANON_KEY from the fetch call in the old version of this file ---- */
const FUNCTION_URL = 'https://ekplyauihbtwiyecvwcu.supabase.co/functions/v1/spreadconnect-products';
const ANON_KEY = '';      // Supabase anon (public) key, if the old file sent one
const CHECKOUT_URL = '';  // Stripe checkout function URL. Leave empty until Stripe is connected.

const AUDIENCES = [
  {name:'Babies & Toddlers', sub:'Rompers, bodysuits, tees'},
  {name:'Kids & Youth', sub:'Tees, long sleeves, hoodies'},
  {name:'Women', sub:'Tees, long sleeves, hoodies'},
  {name:'Men', sub:'Tees, long sleeves, hoodies'},
  {name:'Adult Unisex', sub:'Tees, long sleeves, hoodies'}
];
const TYPES = ['T-Shirts','Long Sleeves','Hoodies & Sweatshirts','Rompers & Bodysuits','Tanks'];

const $ = id => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const e = Object.assign(document.createElement(tag), props);
  [].concat(kids).forEach(k => e.append(k));
  return e;
};

function normAudience(s){
  s = (s||'').toLowerCase();
  if(/baby|babies|toddler|infant/.test(s)) return 'Babies & Toddlers';
  if(/kid|youth|child/.test(s)) return 'Kids & Youth';
  if(/women|woman|ladies/.test(s)) return 'Women';
  if(/\bmen|\bman\b/.test(s)) return 'Men';
  if(/unisex|adult/.test(s)) return 'Adult Unisex';
  return '';
}
function normType(s){
  s = (s||'').toLowerCase();
  if(/romper|bodysuit|onesie/.test(s)) return 'Rompers & Bodysuits';
  if(/long\s*sleeve/.test(s)) return 'Long Sleeves';
  if(/hood|sweat|crew/.test(s)) return 'Hoodies & Sweatshirts';
  if(/tank/.test(s)) return 'Tanks';
  if(/shirt|tee/.test(s)) return 'T-Shirts';
  return '';
}
function money(v){
  if(typeof v === 'string' && /^\$/.test(v.trim())) return v.trim();
  const n = parseFloat(v);
  return isNaN(n) ? '' : '$' + n.toFixed(2);
}
function pickList(v){
  return (Array.isArray(v) ? v : []).map(x => typeof x === 'string' ? x : (x && (x.name || x.label || x.value))).filter(Boolean);
}
function normalize(p, i){
  const desc = p.description || p.desc || '';
  const m = desc.match(/^\s*\[([^\]]+)\]\s*/);
  let [a, t] = m ? m[1].split('|').map(s => s.trim()) : ['', ''];
  const title = (p.title || p.name || '').replace(/^tiny dreams lullaby\s*[-:|]?\s*/i, '');
  const img = p.image || p.imageUrl || p.image_url || p.thumbnail || (Array.isArray(p.images) && (p.images[0].url || p.images[0])) || '';
  return {
    id: String(p.id || p.sku || i),
    title,
    desc: desc.replace(/^\s*\[[^\]]+\]\s*/, ''),
    img,
    price: money(p.price != null ? p.price : p.retailPrice),
    audience: normAudience(a) || normAudience(title),
    type: normType(t) || normType(a) || normType(title),
    sizes: pickList(p.sizes),
    colors: pickList(p.colors || p.appearances)
  };
}

let products = [], fAud = '', fType = '', cart = [];
try{ cart = JSON.parse(localStorage.getItem('tdl-cart')) || []; }catch(e){}

function renderFilters(){
  const d = $('dreamers'); d.replaceChildren();
  AUDIENCES.forEach(a => {
    const n = products.filter(p => p.audience === a.name).length;
    const b = el('button', {className:'dreamer'}, [a.name, el('small', {textContent: a.sub})]);
    b.setAttribute('aria-pressed', fAud === a.name);
    b.onclick = () => { fAud = fAud === a.name ? '' : a.name; renderFilters(); renderGrid(); };
    d.append(b);
  });
  const c = $('chips'); c.replaceChildren();
  ['All'].concat(TYPES).forEach(t => {
    const v = t === 'All' ? '' : t;
    const b = el('button', {className:'chip', textContent:t});
    b.setAttribute('aria-pressed', fType === v);
    b.onclick = () => { fType = v; renderFilters(); renderGrid(); };
    c.append(b);
  });
}
function renderGrid(){
  const g = $('grid'); g.replaceChildren();
  const list = products.filter(p => (!fAud || p.audience === fAud) && (!fType || p.type === fType));
  if(!list.length){
    g.append(el('p', {className:'note', textContent: products.length ? 'Nothing here yet. Try another choice above.' : 'Products are on the way. Check back soon.'}));
    return;
  }
  list.forEach(p => {
    const card = el('button', {className:'card', type:'button'}, [
      el('img', {src:p.img, alt:p.title, loading:'lazy'}),
      el('div', {}, [el('b', {textContent:p.title}), el('span', {textContent:p.price})])
    ]);
    card.onclick = () => openProduct(p);
    g.append(card);
  });
}

function openProduct(p){
  let size = '', color = '';
  const info = el('div', {className:'info'}, [el('h3', {textContent:p.title}), el('b', {textContent:p.price}), el('p', {textContent:p.desc})]);
  const group = (label, vals, set) => {
    if(!vals.length) return;
    const row = el('div', {className:'opts', role:'group'});
    row.setAttribute('aria-label', label);
    vals.forEach(v => {
      const b = el('button', {className:'opt', type:'button', textContent:v});
      b.setAttribute('aria-pressed', 'false');
      b.onclick = () => { row.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); set(v); };
      row.append(b);
    });
    info.append(el('b', {textContent:label}), row);
  };
  group('Size', p.sizes, v => size = v);
  group('Color', p.colors, v => color = v);
  const err = el('p', {className:'msg'});
  const add = el('button', {className:'add', type:'button', textContent:'Add to cart'});
  add.onclick = () => {
    if(p.sizes.length && !size){ err.textContent = 'Choose a size first.'; return; }
    if(p.colors.length && !color){ err.textContent = 'Choose a color first.'; return; }
    const key = [p.id, size, color].join('|');
    const hit = cart.find(l => l.key === key);
    hit ? hit.qty++ : cart.push({key, id:p.id, title:p.title, price:p.price, img:p.img, size, color, qty:1});
    saveCart(); $('dlg').close(); $('drawer').classList.add('open');
  };
  info.append(add, err);
  $('pd').replaceChildren(el('img', {src:p.img, alt:p.title}), info);
  $('dlg').showModal();
}

function saveCart(){
  try{ localStorage.setItem('tdl-cart', JSON.stringify(cart)); }catch(e){}
  $('cartCount').textContent = cart.reduce((s,l) => s + l.qty, 0);
  const box = $('items'); box.replaceChildren();
  if(!cart.length) box.append(el('p', {className:'note', textContent:'Your cart is empty.'}));
  cart.forEach(l => {
    const rm = el('button', {textContent:'Remove'});
    rm.onclick = () => { cart = cart.filter(x => x !== l); saveCart(); };
    box.append(el('div', {className:'line'}, [
      el('img', {src:l.img, alt:''}),
      el('div', {}, [el('b', {textContent:l.title}), el('div', {textContent:[l.size, l.color, 'Qty ' + l.qty].filter(Boolean).join(', ')})]),
      el('div', {}, [el('div', {textContent:l.price}), rm])
    ]));
  });
  const total = cart.reduce((s,l) => s + (parseFloat(String(l.price).replace('$','')) || 0) * l.qty, 0);
  $('total').textContent = '$' + total.toFixed(2);
}

$('openCart').onclick = () => $('drawer').classList.add('open');
$('closeCart').onclick = () => $('drawer').classList.remove('open');
$('closeDlg').onclick = () => $('dlg').close();
$('checkout').onclick = async () => {
  const msg = $('msg');
  if(!cart.length){ msg.textContent = 'Add something to your cart first.'; return; }
  if(!CHECKOUT_URL){ msg.textContent = 'Checkout opens once Stripe is connected.'; return; }
  msg.textContent = 'Taking you to checkout...';
  try{
    const r = await fetch(CHECKOUT_URL, {method:'POST', headers:{'Content-Type':'application/json', ...(ANON_KEY && {Authorization:'Bearer ' + ANON_KEY})}, body:JSON.stringify({cart})});
    const j = await r.json();
    if(j.url) location.href = j.url; else throw new Error('No checkout URL');
  }catch(e){ msg.textContent = 'Checkout could not start. Please try again.'; }
};

async function load(){
  try{
    const r = await fetch(FUNCTION_URL, {headers: ANON_KEY ? {Authorization:'Bearer ' + ANON_KEY, apikey:ANON_KEY} : {}});
    const j = await r.json();
    const arr = Array.isArray(j) ? j : (j.products || j.items || j.data || []);
    products = arr.map(normalize).filter(p => p.title);
  }catch(e){
    $('grid').replaceChildren(el('p', {className:'note', textContent:'Products could not load. Refresh the page to try again.'}));
    renderFilters(); saveCart(); return;
  }
  renderFilters(); renderGrid(); saveCart();
}
renderFilters(); saveCart(); load();
</script>
</body>
</html>
