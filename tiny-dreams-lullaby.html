<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Dreams Lullaby</title>
<style>
  :root { --bg:#f6f3ff; --ink:#2b2542; --muted:#6d6788; --card:#ffffff; --accent:#7a6ad8; --line:#e3ddf5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  .back { display:inline-block; color:var(--accent); text-decoration:none; margin-bottom:16px; }
  h1 { text-align:center; font-size:2.4rem; margin:8px 0 4px; }
  .sub { text-align:center; color:var(--muted); margin:0 0 24px; }
  nav.cats { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:32px; }
  nav.cats a { padding:8px 16px; border:1px solid var(--line); border-radius:999px; text-decoration:none; color:var(--ink); background:var(--card); }
  nav.cats a:hover { border-color:var(--accent); color:var(--accent); }
  section.cat { margin-bottom:44px; }
  section.cat h2 { margin:0 0 4px; }
  section.cat p.blurb { margin:0 0 16px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .card img { width:100%; display:block; aspect-ratio:1/1; object-fit:cover; background:#eee; }
  .card .body { padding:12px 14px 16px; }
  .card .name { font-weight:700; margin-bottom:6px; }
  .card .price { color:var(--muted); margin-bottom:10px; }
  .card .soon { display:inline-block; padding:6px 14px; border-radius:999px; background:var(--line); color:var(--muted); font-size:.9rem; }
  .status { text-align:center; color:var(--muted); padding:30px 0; }
  footer { text-align:center; color:var(--muted); margin-top:40px; font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back to Love Hart Design</a>
  <h1>Tiny Dreams Lullaby</h1>
  <p class="sub">Little boys' apparel, browse by category</p>
  <nav class="cats" id="cats"></nav>
  <div id="shop"><div class="status">Loading designs&hellip;</div></div>
  <footer>&copy; Love Hart Design 2026</footer>
</div>

<script>
(function () {
  var FEED = "https://ekplyauihbtwiyecvwcu.supabase.co/functions/v1/spreadconnect-products";
  var BRAND = "tiny-dreams-lullaby";

  // key = word typed in [brackets] at the start of the Spreadconnect description
  var CATEGORIES = [
    { key: "dinosaurs", id: "dino",    title: "Dinosaurs & Adventure", blurb: "Roaring dinos and adventure-themed designs." },
    { key: "space",     id: "space",   title: "Space & Rockets",       blurb: "Rockets, planets, and starry space art." },
    { key: "trucks",    id: "trucks",  title: "Trucks & Vehicles",     blurb: "Trucks, trains, and vehicle graphics." },
    { key: "animals",   id: "animals", title: "Animals & Nature",      blurb: "Friendly animal and nature-themed art." }
  ];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function cleanTitle(t) {
    return String(t).replace(/^Tiny Dreams Lullaby\s*[\u2013\u2014-]\s*/i, "");
  }

  function categoryOf(p) {
    var plain = String(p.description || "").replace(/<[^>]*>/g, " ");
    var m = plain.match(/^\s*\[([^\]]+)\]/);
    if (!m) return null;
    var word = m[1].toLowerCase();
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (word.indexOf(CATEGORIES[i].key) === 0) return CATEGORIES[i].key;
    }
    return null;
  }

  function card(p) {
    var c = el("div", "card");
    if (p.images && p.images[0]) {
      var img = document.createElement("img");
      img.src = p.images[0];
      img.alt = cleanTitle(p.title);
      c.appendChild(img);
    }
    var b = el("div", "body");
    b.appendChild(el("div", "name", cleanTitle(p.title)));
    b.appendChild(el("div", "price", "$" + Number(p.price).toFixed(2)));
    b.appendChild(el("span", "soon", "Coming soon"));
    c.appendChild(b);
    return c;
  }

  function section(id, title, blurb, items) {
    var s = el("section", "cat");
    s.id = id;
    s.appendChild(el("h2", "", title));
    if (blurb) s.appendChild(el("p", "blurb", blurb));
    var g = el("div", "grid");
    items.forEach(function (p) { g.appendChild(card(p)); });
    s.appendChild(g);
    return s;
  }

  function render(products) {
    var shop = document.getElementById("shop");
    var cats = document.getElementById("cats");
    shop.innerHTML = "";
    cats.innerHTML = "";

    if (!products.length) {
      shop.appendChild(el("div", "status", "New designs are coming soon."));
      return;
    }

    var used = {};
    CATEGORIES.forEach(function (cat) {
      var items = products.filter(function (p) { return categoryOf(p) === cat.key; });
      if (!items.length) return;
      items.forEach(function (p) { used[p.id] = true; });
      shop.appendChild(section(cat.id, cat.title, cat.blurb, items));
      var a = el("a", "", cat.title);
      a.href = "#" + cat.id;
      cats.appendChild(a);
    });

    var rest = products.filter(function (p) { return !used[p.id]; });
    if (rest.length) {
      shop.appendChild(section("more", "More designs", "", rest));
      var m = el("a", "", "More designs");
      m.href = "#more";
      cats.appendChild(m);
    }
  }

  fetch(FEED)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var list = (data.brands && data.brands[BRAND]) || [];
      list = list.filter(function (p) { return !/test/i.test(p.title); });
      render(list);
    })
    .catch(function (err) {
      console.error("Product feed failed:", err);
      document.getElementById("shop").innerHTML = "";
      document.getElementById("shop").appendChild(el("div", "status", "Designs couldn't load right now. Please try again soon."));
    });
})();
</script>
</body>
</html>
